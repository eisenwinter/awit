name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch: {}

permissions:
  contents: write

# Two pushes to main must not race for gh-pages. Queue instead of cancelling:
# a cancelled deploy can leave the published site one commit behind forever.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          # gh-deploy commits to gh-pages; it needs the full history of the
          # branch it pushes to, and a shallow clone makes the push fail.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: install docs toolchain
        run: pip install -r requirements-docs.txt

      # Build first, always. A broken link fails here, on pull requests too,
      # before anything is published.
      - name: build
        run: mkdocs build --strict

      - name: deploy to gh-pages
        if: github.event_name != 'pull_request'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force --strict
