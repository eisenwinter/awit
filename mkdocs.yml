site_name: awit
site_description: >-
  Agent work item tool: a zero-daemon Go CLI that turns Markdown files under
  .awit/ into a dependency graph for humans and agents.
site_url: https://eisenwinter.github.io/awit/
site_author: Jan Eisenwinter
copyright: BSD 2-Clause

repo_url: https://github.com/eisenwinter/awit
repo_name: eisenwinter/awit
edit_uri: edit/main/docs/

# Warnings are errors everywhere — local builds, PR checks and gh-deploy alike.
strict: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  features:
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme)"
      toggle: {icon: material/brightness-auto, name: Follow system theme}
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle: {icon: material/brightness-4, name: Switch to light mode}

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - How it works: how-it-works.md
  - Setup & Usage: usage.md
  - Design Spec: design-spec.md
  - On-disk Schema: schema.md
  - FAQ: faq.md
